name: release

# Driftwatchdog release packaging. Triggered by a version tag (vX.Y.Z).
# Builds the three supported native targets, packages each binary into
# the documented archive names, generates a SHA-256 checksum manifest
# from the final files, and publishes every asset together. If any
# matrix build or checksum step fails, the publish job never runs so
# incomplete assets never ship.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: driftwatchdog-linux-x86_64
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            artifact: driftwatchdog-linux-arm64
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            artifact: driftwatchdog-darwin-x86_64
            os: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          mkdir -p stage
          scripts/package.sh "${{ matrix.target }}" "${{ matrix.artifact }}" stage

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: stage
          merge-multiple: true

      - name: Verify stage contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(stage/*.tar.gz)
          if [ "${#archives[@]}" -lt 3 ]; then
            echo "expected 3 archives, found ${#archives[@]}: ${archives[*]}" >&2
            exit 1
          fi
          for a in "${archives[@]}"; do
            tar -tzf "$a" | head -1
          done

      - name: Generate checksum manifest
        run: |
          set -euo pipefail
          chmod +x scripts/checksum.sh
          version=$(awk '/^\[package\]/ { in_pkg = 1 } in_pkg && /^version/ { sub(/^version[ \t]*=[ \t]*/, ""); sub(/[ \t]*$/, ""); gsub(/^"|"$/, ""); print; exit }' Cargo.toml)
          scripts/checksum.sh stage "$version"
          cat stage/driftwatchdog-${version}-checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stage/*.tar.gz
            stage/*-checksums.txt
