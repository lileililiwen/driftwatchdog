name: release

# Driftwatchdog release packaging. Triggered by a version tag (vX.Y.Z).
# Builds the three supported native targets, packages each binary into
# the documented archive names, generates a SHA-256 checksum manifest
# from the final files, and publishes every asset together. If any
# matrix build or checksum step fails, the publish job never runs so
# incomplete assets never ship.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: driftwatchdog-linux-x86_64
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            artifact: driftwatchdog-linux-arm64
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            artifact: driftwatchdog-darwin-x86_64
            os: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: |
          set -euo pipefail
          chmod +x scripts/package.sh
          mkdir -p stage
          scripts/package.sh "${{ matrix.target }}" "${{ matrix.artifact }}" stage

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: stage
          merge-multiple: true

      - name: Verify stage contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(stage/*.tar.gz)
          if [ "${#archives[@]}" -lt 3 ]; then
            echo "expected 3 archives, found ${#archives[@]}: ${archives[*]}" >&2
            exit 1
          fi
          for a in "${archives[@]}"; do
            tar -tzf "$a" | head -1
          done

      - name: Generate checksum manifest
        run: |
          set -euo pipefail
          chmod +x scripts/checksum.sh
          version=$(awk '/^\[package\]/ { in_pkg = 1 } in_pkg && /^version/ { sub(/^version[ \t]*=[ \t]*/, ""); sub(/[ \t]*$/, ""); gsub(/^"|"$/, ""); print; exit }' Cargo.toml)
          scripts/checksum.sh stage "$version"
          cat stage/driftwatchdog-${version}-checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stage/*.tar.gz
            stage/*-checksums.txt

  npm-publish:
    name: publish npm package
    needs: publish
    runs-on: ubuntu-22.04
    # The npm package is pinned to the same version as the GitHub
    # release tag, so the launcher's download URL resolves. Runs only
    # on tag pushes so re-running the workflow never republishes npm
    # (npm refuses to overwrite a published version).
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Pin npm version to tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          printf 'tag=%s\n' "$tag"
          cd npm/driftwatchdog
          # Write the version directly instead of `npm version` so we
          # never accidentally tag git. The `--no-git-tag-version` flag
          # is not enough on its own; we just edit the file.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.resolve('package.json');
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          " "$tag"
          node -e "console.log(require('./package.json').version)"

      - name: Verify npm package contents
        run: |
          set -euo pipefail
          cd npm/driftwatchdog
          test -f README.md || { echo 'README.md missing' >&2; exit 1; }
          test -f bin/driftwatch.js || { echo 'bin/driftwatch.js missing' >&2; exit 1; }
          test -f lib/platform.js || { echo 'lib/platform.js missing' >&2; exit 1; }
          test -f lib/release.js || { echo 'lib/release.js missing' >&2; exit 1; }
          test -f lib/verify.js || { echo 'lib/verify.js missing' >&2; exit 1; }
          npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd npm/driftwatchdog
          # `--provenance` is opt-in: it attaches an npm-signed
          # attestation to the published tarball using the workflow's
          # OIDC identity. Requires an npm trust level of at least
          # "automation" on the publishing account; comment out if the
          # token does not have it.
          npm publish --provenance --access public
