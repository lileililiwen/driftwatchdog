[package]
name = "driftwatchdog"
version = "0.1.0"
edition = "2021"
# Minimum supported Rust version. Floor is set by clap 4 (1.74);
# CI pins this toolchain to keep the claim honest.
rust-version = "1.74"
description = "Local-first runtime failure memory for AI-assisted coding workflows."
license = "MIT"
repository = "https://github.com/lileililiwen/driftwatchdog"
homepage = "https://github.com/lileililiwen/driftwatchdog"
keywords = ["ai", "cli", "fingerprinting", "runtime", "memory"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "driftwatchdog"
path = "src/main.rs"

# Dependency policy: floors below are the versions reviewed into
# Cargo.lock (toml 0.8.23, rusqlite 0.31.0, thiserror 1.0.69).
# Bumping any floor requires `cargo update -p <crate>`,
# `cargo deny check`, and the full gate suite. See deny.toml for
# the advisory/license policy.
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.19"
rusqlite = { version = "0.31.0", features = ["bundled"] }
thiserror = "1.0.61"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.11"
regex = "1"
fancy-regex = "0.13"
libc = "0.2"
clap_complete = "4.6"
clap_mangen = "0.2"

[dev-dependencies]
tempfile = "3"
predicates = "3"
assert_cmd = "2"
proptest = "1.11"

# Crate-level lints: clippy `all` is denied here (not just in CI) so
# a new warning fails every build profile, including `--all-features`.
# `unsafe_code` is intentionally not forbidden: process-group signal
# delivery (`checker/runner.rs`, `runtime/runner.rs`) requires two
# audited `unsafe` blocks around `libc::kill`; everything else must
# stay safe-only.
[lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
