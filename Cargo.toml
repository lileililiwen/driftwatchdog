[package]
name = "driftwatch"
version = "0.1.0"
edition = "2021"
description = "Local-first runtime failure memory for AI-assisted coding workflows."
license = "LicenseRef-Driftwatch"

[[bin]]
name = "driftwatch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
regex = "1"
fancy-regex = "0.13"

[dev-dependencies]
tempfile = "3"
predicates = "3"
assert_cmd = "2"

[profile.release]
lto = "thin"
codegen-units = 1
