version: 1
runtime: driftwatchdog
profile: rust-product
rule_pack: workspace-governance@1
checks:
  repository: true
  build: true
  tests: true
  security: true
  # Scheduled by the `rust-product` profile. This repository used to record
  # `UNBOUND` (exit 1) and block on it, on the reasoning that the governance
  # checker lives in a sibling and no path could be defaulted. That reasoning
  # described a real constraint and then stopped one short of the answer: the
  # constraint is that the path must be written down, not that none may be.
  # The concern is declared here and bound in `commands:` below, scoped to
  # `--project driftwatchdog` because the concern filters findings by code
  # and not by project — an unscoped workspace audit would fail this
  # repository on other repositories' findings. The concern's behaviour is
  # pinned by `tests/gate_governance_quality.rs` as well as now being run.
  governance-quality: true
  declared-verification: true
blocking:
  - FAIL
  - REVIEW_REQUIRED

commands:
  # Generated from .project.json verification.command by workspace-governance/scripts/bind_verification_command.py.
  # A verifier that no gate runs does not gate (ruling D18). Re-run the
  # generator to update it; do not hand-edit.
  declared-verification: 'cargo test --workspace --all-targets'
  # Generated by workspace-governance/scripts/bind_gate_commands.py from the files on disk in this
  # repository, for the concerns this manifest already selects under
  # `checks:`. A verifier that no gate runs does not gate (ruling D18).
  # Re-run the generator to update these; do not hand-edit. Concerns it
  # could not derive are recorded in gate-debt.json, not guessed.
  repository: 'git diff --check'
  build: 'cargo build'
  tests: 'cargo test'
  security: 'cargo audit'
  governance-quality: 'python3 ../workspace-governance/scripts/workspace_check.py --root .. --project driftwatchdog --json'
